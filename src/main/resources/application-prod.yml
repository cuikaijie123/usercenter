  spring:
    application:
      name: UserCenter
    # DataSource Config
    datasource:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://82.157.157.80:3306/111?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
      username: 111
      password: admin
    hikari:
      minimum-idle: 3   #连接池最小空闲连接数
      maximum-pool-size: 10 #最大并发连接，云数据库够用
      idle-timeout: 300000 #空闲连接5分钟自动回收(毫秒)
  server:
    port: 8080
    servlet:
      context-path: /api
      # session 失效时间
    session:
      timeout: 86400
  mybatis-plus:
    configuration:
      map-underscore-to-camel-case: false
    global-config:
      db-config:
        logic-delete-field: isDelete # 全局逻辑删除的实体字段名(since 3.3.0,配置后可以忽略不配置步骤2)
        logic-delete-value: 1 # 逻辑已删除值(默认为 1)
        logic-not-delete-value: 0 # 逻辑未删除值(默认为 0)